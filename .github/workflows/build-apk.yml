name: Build HY300 Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android packages
        run: sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -o HY300Launcher-ChromeOS.zip -d extracted
          mkdir -p android-project
          cp -R extracted/HY300Launcher/HY300Launcher/. android-project/

      - name: Publish extracted source to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android-project
          if ! git diff --cached --quiet; then
            git commit -m "Add extracted Android project sources"
            git push
          fi

      - name: Build APK
        run: |
          cd extracted/HY300Launcher/HY300Launcher
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HY300Launcher-APK
          path: extracted/HY300Launcher/HY300Launcher/app/build/outputs/apk/debug/app-debug.apk
