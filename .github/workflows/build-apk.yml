
name: Build HY300 Launcher

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract project
        run: |
          unzip HY300Launcher-ChromeOS.zip -d extracted
          cd extracted/HY300Launcher/HY300Launcher
          echo "PROJECT_DIR=$PWD" >> $GITHUB_ENV

      - name: Configure Android SDK
        uses: android-actions/setup-android@v3

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HY300Launcher
          path: extracted/HY300Launcher/HY300Launcher/app/build/outputs/apk/debug/app-debug.apk
